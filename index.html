<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>حفل زفاف إسلام & سارة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #c8bfb0;
      padding: 24px 12px;
      font-family: 'Amiri', serif;
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 480px;
      aspect-ratio: 568 / 800;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 12px 48px rgba(0,0,0,.30);
    }

    .card-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    /* buffet: absolute, no overlay wrapper needed */
    .buffet {
      position: absolute;
      bottom: 23%;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      font-size: clamp(.8rem, 1.7vw, .82rem);
      color: #6a7858;
      background: transparent;
      border: none;
      padding: 0;
      line-height: 1.7;
    }

    /* countdown: absolute, bottom of card, no frame */
    .countdown-wrap {
      position: absolute;
      bottom: 13%;
      left: 50%;
      transform: translateX(-50%);
      width: 85%;
      background: transparent;
      backdrop-filter: none;
      border: none;
      padding: 0;
      text-align: center;
    }

    .countdown-title {
      font-size: clamp(.55rem, 1.5vw, .72rem);
      color: #7a8868;
      margin-bottom: 6px;
      letter-spacing: .3px;
    }

    .tiles {
      display: flex;
      justify-content: center;
      /* ltr so days on left, seconds on right regardless of rtl page */
      direction: ltr;
      gap: 3%;
    }

    .tile { text-align: center; }

    .tile-num {
      font-family: 'Scheherazade New', serif;
      font-size: clamp(1.2rem, 5vw, 2rem);
      font-weight: 700;
      color: #3a2010;
      background: transparent;
      border-radius: 3px;
      padding: 2px 8px;
      display: block;
      min-width: clamp(36px, 10vw, 52px);
      line-height: 1.2;
    }

    .tile-label {
      font-size: clamp(.5rem, 1.3vw, .65rem);
      color: #7a8868;
      display: block;
      margin-top: 3px;
    }

    .finished-msg {
      font-family: 'Scheherazade New', serif;
      font-size: clamp(1rem, 4vw, 1.5rem);
      color: #b8870a;
      display: none;
    }
  </style>
</head>

<script>
  const weddingDate = new Date('2026-09-18T20:00:00+03:00');
  function pad(n) { return String(n).padStart(2, '0'); }
  function tick() {
    const diff = weddingDate - new Date();
    if (diff <= 0) {
      document.getElementById('countdown').style.display = 'none';
      document.getElementById('finished').style.display = 'block';
      return;
    }
    const s = Math.floor(diff / 1000);
    document.getElementById('days').textContent    = pad(Math.floor(s / 86400));
    document.getElementById('hours').textContent   = pad(Math.floor((s % 86400) / 3600));
    document.getElementById('minutes').textContent = pad(Math.floor((s % 3600) / 60));
    document.getElementById('seconds').textContent = pad(s % 60);
  }
  tick();
  setInterval(tick, 1000);
</script>
